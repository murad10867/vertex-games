<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050913">
  <meta name="description" content="لعبة هروب من النيازك من Vertex Games">
  <title>هروب من النيازك | Vertex Games</title>
  <link rel="stylesheet" href="meteor.css">
  <script src="security.js" defer></script>
  <script src="meteor.js" defer></script>
</head>
<body>
  <header class="game-topbar">
    <a href="./" class="back-link">← Vertex Games</a>
    <strong>☄️ هروب من النيازك</strong>
  </header>

  <main class="game-page">
    <section class="scorebar" aria-label="نتيجة اللعبة">
      <div><span>النقاط</span><strong id="score">0</strong></div>
      <div><span>الأفضل</span><strong id="bestScore">0</strong></div>
      <div><span>المستوى</span><strong id="level">1</strong></div>
    </section>

    <section class="game-shell">
      <canvas id="gameCanvas" width="900" height="520" aria-label="لعبة هروب من النيازك"></canvas>

      <div id="startOverlay" class="overlay">
        <div class="overlay-card">
          <div class="big-icon">☄️</div>
          <h1>هروب من النيازك</h1>
          <p>تحرك يمين ويسار وتجنب النيازك. كلما صمدت أكثر، زادت السرعة.</p>
          <p class="keys">الكمبيوتر: ← → أو A D &nbsp; • &nbsp; الجوال: الأزرار تحت اللعبة</p>
          <button id="startBtn" type="button">ابدأ اللعبة</button>
        </div>
      </div>

      <div id="gameOverOverlay" class="overlay hidden">
        <div class="overlay-card">
          <div class="big-icon">💥</div>
          <h2>انتهت اللعبة</h2>
          <p>نتيجتك: <strong id="finalScore">0</strong></p>
          <button id="restartBtn" type="button">العب مرة ثانية</button>
        </div>
      </div>
    </section>

    <section class="mobile-controls" aria-label="أزرار التحكم">
      <button id="rightBtn" type="button" aria-label="تحرك يمين">→</button>
      <button id="leftBtn" type="button" aria-label="تحرك يسار">←</button>
    </section>

    <p class="tip">حاول تكسر رقمك القياسي 😎</p>
  </main>
</body>
</html>
