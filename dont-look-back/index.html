<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="DON'T LOOK BACK - لعبة رعب 3D من Vertex Games">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>DON'T LOOK BACK | Vertex Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="security.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" defer></script>
  <script src="game.js?v=20260923-camerafix" defer></script>
</head>
<body>
  <div id="game">
    <canvas id="world"></canvas>

    <header class="hud">
      <div class="brand">
        <strong>DON'T LOOK BACK</strong>
        <small>Vertex Horror</small>
      </div>
      <div class="stats">
        <span>الفيوزات <b id="fuseValue">0 / 3</b></span>
        <span>المصباح <b id="lightValue">ON</b></span>
      </div>
    </header>

    <div id="objective" class="objective">ابحث عن 3 فيوزات وافتح باب الخروج.</div>
    <div id="crosshair">+</div>
    <div id="warning" class="warning"></div>

    <div id="overlay" class="overlay show">
      <div class="card">
        <div class="eye">👁️</div>
        <p class="eyebrow">VERTEX HORROR</p>
        <h1>DON'T LOOK BACK</h1>
        <p id="overlayText">أنت محبوس في مبنى مظلم. اجمع 3 فيوزات، ثم اهرب قبل أن يجدك الشيء الذي يتحرك في الظلام.</p>
        <button id="startBtn">ادخل المبنى</button>
        <small>WASD للحركة • حرّك الماوس للنظر • F للمصباح • Shift للجري</small>
      </div>
    </div>

    <div class="mobile">
      <button data-action="forward">↑</button>
      <div>
        <button data-action="left">↶</button>
        <button data-action="back">↓</button>
        <button data-action="right">↷</button>
      </div>
      <button id="flashBtn" class="flash">🔦</button>
    </div>
  </div>
</body>
</html>
